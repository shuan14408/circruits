<script>
const H=function(col,row){
  const bx=120,by=30,sx=bx+12,gx=14;
  const rm={a:0,b:1,c:2,d:3,e:4,f:5,g:6,h:7,i:8,j:9};
  const x=sx+(col-1)*gx;
  const y=rm[row]<5?by+40+rm[row]*18:by+148+(rm[row]-5)*18;
  return{x,y};
};
const AX=120,AY=390,AW=440;
function pinX(n){
  const specials={GND:AX+15,GND2:AX+35,"5V":AX+55,"3.3V":AX+75,A0:AX+100,A1:AX+118,A2:AX+136};
  if(specials[n]!==undefined)return specials[n];
  return AX+AW-20-parseInt(n)*18;
}
function pinY(){return AY-4;}

let curA=0, curS=0;

function drawBoard(){
  let s='';
  const bx=120,by=30,bw=440,bh=320;
  s+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6" fill="var(--color-background-secondary,#f0f0f0)" stroke="var(--color-border-secondary,#ccc)" stroke-width="1"/>`;
  s+=`<text x="${bx+bw/2}" y="${by+14}" text-anchor="middle" fill="var(--color-text-tertiary)" font-size="10" font-family="var(--font-sans)">麵包板</text>`;
  const sx=bx+12,gx=14,cols=30;
  'abcde'.split('').forEach((c,r)=>{s+=`<text x="${sx-10}" y="${by+42+r*18}" text-anchor="middle" fill="var(--color-text-tertiary)" font-size="8" font-family="var(--font-sans)">${c}</text>`;});
  'fghij'.split('').forEach((c,r)=>{s+=`<text x="${sx-10}" y="${by+150+r*18}" text-anchor="middle" fill="var(--color-text-tertiary)" font-size="8" font-family="var(--font-sans)">${c}</text>`;});
  for(let c=0;c<cols;c++){
    if(c%5===0)s+=`<text x="${sx+c*gx}" y="${by+26}" text-anchor="middle" fill="var(--color-text-tertiary)" font-size="7" font-family="var(--font-sans)">${c+1}</text>`;
    for(let r=0;r<5;r++)s+=`<circle cx="${sx+c*gx}" cy="${by+40+r*18}" r="2.3" fill="var(--color-border-secondary,#bbb)"/>`;
    for(let r=0;r<5;r++)s+=`<circle cx="${sx+c*gx}" cy="${by+148+r*18}" r="2.3" fill="var(--color-border-secondary,#bbb)"/>`;
  }
  s+=`<rect x="${sx-4}" y="${by+128}" width="${29*gx+8}" height="10" rx="2" fill="var(--color-background-tertiary,#e0e0e0)"/>`;
  s+=`<text x="${bx+bw/2}" y="${by+136}" text-anchor="middle" fill="var(--color-text-tertiary)" font-size="7" font-family="var(--font-sans)">溝 槽</text>`;
  return s;
}

function drawArduino(){
  let s='';
  s+=`<rect x="${AX}" y="${AY}" width="${AW}" height="35" rx="4" fill="#0D47A1" stroke="#0a3a80" stroke-width="1"/>`;
  s+=`<text x="${AX+AW/2}" y="${AY+19}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="12" font-weight="500" font-family="var(--font-sans)">Arduino Uno R3</text>`;
  [{n:"GND",x:AX+15},{n:"GND",x:AX+35},{n:"5V",x:AX+55},{n:"3.3V",x:AX+75},{n:"A0",x:AX+100},{n:"A1",x:AX+118}].forEach(p=>{
    s+=`<circle cx="${p.x}" cy="${AY-4}" r="4" fill="#FFD600" stroke="#0D47A1" stroke-width="1"/>`;
    s+=`<text x="${p.x}" y="${AY-13}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="7" font-family="var(--font-sans)">${p.n}</text>`;
  });
  for(let i=0;i<=13;i++){
    const x=AX+AW-20-i*18;
    s+=`<circle cx="${x}" cy="${AY-4}" r="4" fill="#90CAF9" stroke="#0D47A1" stroke-width="1"/>`;
    s+=`<text x="${x}" y="${AY-13}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="7" font-family="var(--font-sans)">${i}</text>`;
  }
  return s;
}

function wire(fx,fy,tx,ty,col,label,offY){
  let s=`<path d="M${fx} ${fy} L${fx} ${fy+(offY||100)} L${tx} ${ty}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
  if(label)s+=`<text x="${tx}" y="${ty+16}" text-anchor="middle" fill="${col}" font-size="7" font-family="var(--font-sans)">${label}</text>`;
  s+=hl(fx,fy)+hl(tx,ty);
  return s;
}

function comp(act,vis){
  let s='';
  // Act 0: LED blink
  if(act===0){
    if(vis.includes('led')){
      const a=H(12,'e'),b=H(13,'e');
      s+=`<line x1="${a.x}" y1="${a.y-8}" x2="${a.x}" y2="${a.y+2}" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<circle cx="${a.x}" cy="${a.y-10}" r="5" fill="#FF5252" opacity="0.8"/>`;
      s+=`<line x1="${b.x}" y1="${b.y-6}" x2="${b.x}" y2="${b.y+2}" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>`;
      s+=`<text x="${a.x+4}" y="${a.y-18}" text-anchor="middle" fill="#E53935" font-size="8" font-family="var(--font-sans)">LED</text>`;
      s+=hl(a.x,a.y)+hl(b.x,b.y);
    }
    if(vis.includes('r1')){
      const a=H(12,'d'),b=H(8,'d');
      s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<rect x="${(a.x+b.x)/2-12}" y="${a.y-5}" width="24" height="10" rx="3" fill="#A1887F"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y+16}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="7" font-family="var(--font-sans)">220Ω</text>`;
      s+=hl(a.x,a.y)+hl(b.x,b.y);
    }
    if(vis.includes('w1'))s+=wire(H(8,'a').x,H(8,'a').y,pinX('13'),pinY(),'#FF9800','pin 13',130);
    if(vis.includes('w2'))s+=wire(H(13,'a').x,H(13,'a').y,pinX('GND'),pinY(),'#555','GND',100);
  }
  // Act 1: Button LED
  if(act===1){
    if(vis.includes('led')){
      const a=H(12,'e'),b=H(13,'e');
      s+=`<line x1="${a.x}" y1="${a.y-8}" x2="${a.x}" y2="${a.y+2}" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<circle cx="${a.x}" cy="${a.y-10}" r="5" fill="#FF5252" opacity="0.8"/>`;
      s+=`<line x1="${b.x}" y1="${b.y-6}" x2="${b.x}" y2="${b.y+2}" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>`;
      s+=`<text x="${a.x+4}" y="${a.y-18}" text-anchor="middle" fill="#E53935" font-size="8" font-family="var(--font-sans)">LED</text>`;
    }
    if(vis.includes('r1')){
      const a=H(12,'d'),b=H(8,'d');
      s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<rect x="${(a.x+b.x)/2-12}" y="${a.y-5}" width="24" height="10" rx="3" fill="#A1887F"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y+16}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="7" font-family="var(--font-sans)">220Ω</text>`;
    }
    if(vis.includes('w1'))s+=wire(H(8,'a').x,H(8,'a').y,pinX('13'),pinY(),'#FF9800','pin 13',140);
    if(vis.includes('w2'))s+=wire(H(13,'a').x,H(13,'a').y,pinX('GND'),pinY(),'#555','GND',110);
    if(vis.includes('btn')){
      const e20=H(20,'e'),e22=H(22,'e'),f20=H(20,'f'),f22=H(22,'f');
      s+=`<rect x="${e20.x-3}" y="${e20.y-3}" width="${e22.x-e20.x+6}" height="${f22.y-e20.y+6}" rx="3" fill="#555" stroke="#333" stroke-width="1"/>`;
      s+=`<circle cx="${(e20.x+e22.x)/2}" cy="${(e20.y+f20.y)/2}" r="6" fill="#888" stroke="#aaa" stroke-width="1"/>`;
      s+=`<text x="${(e20.x+e22.x)/2}" y="${e20.y-10}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="8" font-family="var(--font-sans)">按鈕</text>`;
      s+=hl(e20.x,e20.y)+hl(e22.x,e22.y)+hl(f20.x,f20.y)+hl(f22.x,f22.y);
    }
    if(vis.includes('bw1'))s+=wire(H(20,'a').x,H(20,'a').y,pinX('2'),pinY(),'#2196F3','pin 2',120);
    if(vis.includes('bw2'))s+=wire(H(22,'j').x,H(22,'j').y,pinX('5V'),pinY(),'#E53935','5V',60);
    if(vis.includes('br')){
      const a=H(20,'c'),b=H(24,'c');
      s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<rect x="${(a.x+b.x)/2-10}" y="${a.y-5}" width="20" height="10" rx="3" fill="#795548"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y+16}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="7" font-family="var(--font-sans)">10KΩ</text>`;
      s+=hl(a.x,a.y)+hl(b.x,b.y);
    }
    if(vis.includes('bw3'))s+=wire(H(24,'a').x,H(24,'a').y,pinX('GND2'),pinY(),'#555','GND',90);
  }
  // Act 2: Buzzer
  if(act===2){
    if(vis.includes('buz')){
      const a=H(20,'e'),b=H(21,'e');
      s+=`<circle cx="${(a.x+b.x)/2}" cy="${a.y-3}" r="10" fill="#333" stroke="#555" stroke-width="1"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y-18}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="8" font-family="var(--font-sans)">蜂鳴器</text>`;
      s+=`<text x="${a.x}" y="${a.y+12}" text-anchor="middle" fill="#4CAF50" font-size="8" font-family="var(--font-sans)">+</text>`;
      s+=`<text x="${b.x}" y="${b.y+12}" text-anchor="middle" fill="#E53935" font-size="8" font-family="var(--font-sans)">−</text>`;
      s+=hl(a.x,a.y)+hl(b.x,b.y);
    }
    if(vis.includes('zw1'))s+=wire(H(20,'a').x,H(20,'a').y,pinX('8'),pinY(),'#FF9800','pin 8',110);
    if(vis.includes('zw2'))s+=wire(H(21,'a').x,H(21,'a').y,pinX('GND'),pinY(),'#555','GND',130);
  }
  // Act 3: Light sensor
  if(act===3){
    if(vis.includes('ldr')){
      const a=H(15,'e'),b=H(17,'e');
      s+=`<circle cx="${(a.x+b.x)/2}" cy="${a.y-2}" r="8" fill="#CDDC39" stroke="#9E9D24" stroke-width="1"/>`;
      s+=`<line x1="${(a.x+b.x)/2-4}" y1="${a.y-6}" x2="${(a.x+b.x)/2+4}" y2="${a.y+2}" stroke="#7CB342" stroke-width="1.5"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y-16}" text-anchor="middle" fill="#9E9D24" font-size="8" font-family="var(--font-sans)">光敏電阻</text>`;
      s+=hl(a.x,a.y)+hl(b.x,b.y);
    }
    if(vis.includes('lr')){
      const a=H(17,'d'),b=H(20,'d');
      s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<rect x="${(a.x+b.x)/2-10}" y="${a.y-5}" width="20" height="10" rx="3" fill="#795548"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y+16}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="7" font-family="var(--font-sans)">10KΩ</text>`;
      s+=hl(a.x,a.y)+hl(b.x,b.y);
    }
    if(vis.includes('lw1'))s+=wire(H(15,'a').x,H(15,'a').y,pinX('5V'),pinY(),'#E53935','5V',110);
    if(vis.includes('lw2'))s+=wire(H(17,'a').x,H(17,'a').y,pinX('A0'),pinY(),'#4CAF50','A0',130);
    if(vis.includes('lw3'))s+=wire(H(20,'a').x,H(20,'a').y,pinX('GND'),pinY(),'#555','GND',100);
  }
  // Act 4: Smart night light
  if(act===4){
    if(vis.includes('p-led')){
      const a=H(5,'e'),b=H(6,'e');
      s+=`<line x1="${a.x}" y1="${a.y-8}" x2="${a.x}" y2="${a.y+2}" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<circle cx="${a.x}" cy="${a.y-10}" r="5" fill="#FF5252" opacity="0.8"/>`;
      s+=`<line x1="${b.x}" y1="${b.y-6}" x2="${b.x}" y2="${b.y+2}" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>`;
      s+=`<text x="${a.x+4}" y="${a.y-18}" text-anchor="middle" fill="#E53935" font-size="8" font-family="var(--font-sans)">LED</text>`;
    }
    if(vis.includes('p-r1')){
      const a=H(5,'d'),b=H(2,'d');
      s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<rect x="${(a.x+b.x)/2-10}" y="${a.y-5}" width="20" height="10" rx="3" fill="#A1887F"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y+16}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="7" font-family="var(--font-sans)">220Ω</text>`;
    }
    if(vis.includes('p-w1'))s+=wire(H(2,'a').x,H(2,'a').y,pinX('9'),pinY(),'#FF9800','pin 9',140);
    if(vis.includes('p-w2'))s+=wire(H(6,'a').x,H(6,'a').y,pinX('GND'),pinY(),'#555','GND',110);
    if(vis.includes('p-ldr')){
      const a=H(15,'e'),b=H(17,'e');
      s+=`<circle cx="${(a.x+b.x)/2}" cy="${a.y-2}" r="8" fill="#CDDC39" stroke="#9E9D24" stroke-width="1"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y-16}" text-anchor="middle" fill="#9E9D24" font-size="8" font-family="var(--font-sans)">光敏電阻</text>`;
    }
    if(vis.includes('p-r2')){
      const a=H(17,'d'),b=H(20,'d');
      s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<rect x="${(a.x+b.x)/2-10}" y="${a.y-5}" width="20" height="10" rx="3" fill="#795548"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y+16}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="7" font-family="var(--font-sans)">10KΩ</text>`;
    }
    if(vis.includes('p-w3'))s+=wire(H(15,'a').x,H(15,'a').y,pinX('5V'),pinY(),'#E53935','5V',115);
    if(vis.includes('p-w4'))s+=wire(H(17,'a').x,H(17,'a').y,pinX('A0'),pinY(),'#4CAF50','A0',135);
    if(vis.includes('p-w5'))s+=wire(H(20,'a').x,H(20,'a').y,pinX('GND2'),pinY(),'#555','GND',95);
    if(vis.includes('p-buz')){
      const a=H(25,'e'),b=H(26,'e');
      s+=`<circle cx="${(a.x+b.x)/2}" cy="${a.y-3}" r="9" fill="#333" stroke="#555" stroke-width="1"/>`;
      s+=`<text x="${(a.x+b.x)/2}" y="${a.y-18}" text-anchor="middle" fill="var(--color-text-secondary)" font-size="8" font-family="var(--font-sans)">蜂鳴器</text>`;
    }
    if(vis.includes('p-w6'))s+=wire(H(25,'a').x,H(25,'a').y,pinX('8'),pinY(),'#2196F3','pin 8',105);
    if(vis.includes('p-w7'))s+=wire(H(26,'a').x,H(26,'a').y,pinX('GND'),pinY()+10,'#777','GND',80);
  }
  return s;
}

function render(){
  const act=activities[curA], step=act.steps[curS];
  document.getElementById('diagram').innerHTML=drawBoard()+drawArduino()+comp(curA,step.w);
  document.getElementById('wire-desc').innerHTML=step.d;
  document.getElementById('tip-area').textContent=step.t||'';
  document.getElementById('tip-area').style.display=step.t?'block':'none';
  document.getElementById('step-info').textContent=`步驟 ${curS+1} / ${act.steps.length}`;
  document.getElementById('prev-btn').disabled=curS===0;
  document.getElementById('next-btn').disabled=curS===act.steps.length-1;
  let ph='<div class="parts">';
  act.parts.forEach(p=>ph+=`<span class="part">${p}</span>`);
  ph+='</div>';
  document.getElementById('parts-area').innerHTML=ph;
}

function renderTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML='';
  activities.forEach((a,i)=>{
    const d=document.createElement('div');
    d.className='tab'+(i===curA?' active':'');
    d.textContent=a.name;
    d.onclick=()=>{curA=i;curS=0;renderTabs();render();};
    el.appendChild(d);
  });
}

function nextStep(){if(curS<activities[curA].steps.length-1){curS++;render();}}
function prevStep(){if(curS>0){curS--;render();}}

renderTabs();render();
</script>
