function drawBreadboard(svg) {
  let s = '';
  const bx=120, by=30, bw=440, bh=340;
  s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6" fill="var(--color-background-secondary,#f0f0f0)" stroke="var(--color-border-secondary,#ccc)" stroke-width="1"/>`;
  s += `<text class="ts" x="${bx+bw/2}" y="${by+14}" text-anchor="middle" fill="var(--color-text-secondary,#888)" font-size="11">麵包板</text>`;
  const cols=30, startX=bx+12, gapX=14;
  const labels='abcde';
  const labels2='fghij';
  for(let r=0;r<5;r++){
    s+=`<text class="ts" x="${startX-10}" y="${by+42+r*18}" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">${labels[r]}</text>`;
  }
  for(let r=0;r<5;r++){
    s+=`<text class="ts" x="${startX-10}" y="${by+150+r*18}" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">${labels2[r]}</text>`;
  }
  for(let c=0;c<cols;c++){
    if(c%5===0) s+=`<text class="ts" x="${startX+c*gapX}" y="${by+26}" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">${c+1}</text>`;
    for(let r=0;r<5;r++){
      s+=`<circle cx="${startX+c*gapX}" cy="${by+40+r*18}" r="2.5" fill="var(--color-border-secondary,#bbb)" stroke="none"/>`;
    }
    for(let r=0;r<5;r++){
      s+=`<circle cx="${startX+c*gapX}" cy="${by+148+r*18}" r="2.5" fill="var(--color-border-secondary,#bbb)" stroke="none"/>`;
    }
  }
  s+=`<rect x="${startX-4}" y="${by+128}" width="${(cols-1)*gapX+8}" height="10" rx="2" fill="var(--color-background-tertiary,#e0e0e0)"/>`;
  s+=`<text class="ts" x="${bx+bw/2}" y="${by+136}" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">溝 槽</text>`;
  s+=`<rect x="${bx+4}" y="${by+bh-26}" width="${bw-8}" height="12" rx="3" fill="#E53935" opacity="0.15"/>`;
  s+=`<text class="ts" x="${bx+20}" y="${by+bh-18}" font-size="8" fill="#E53935">+ 電源軌</text>`;
  s+=`<rect x="${bx+4}" y="${by+bh-12}" width="${bw-8}" height="12" rx="3" fill="#1A73E8" opacity="0.15"/>`;
  s+=`<text class="ts" x="${bx+20}" y="${by+bh-4}" font-size="8" fill="#1A73E8">− 地線軌</text>`;
  return s;
}

function drawArduino(svg) {
  let s = '';
  const ax=120, ay=385, aw=440, ah=35;
  s+=`<rect x="${ax}" y="${ay}" width="${aw}" height="${ah}" rx="4" fill="#0D47A1" stroke="#0a3a80" stroke-width="1"/>`;
  s+=`<text class="th" x="${ax+aw/2}" y="${ay+ah/2+1}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="12">Arduino Uno R3</text>`;
  const pins = [{n:"GND",x:ax+15},{n:"GND",x:ax+35},{n:"5V",x:ax+55},{n:"3.3V",x:ax+75},{n:"A0",x:ax+100},{n:"A1",x:ax+118}];
  const dpins = [];
  for(let i=0;i<=13;i++) dpins.push({n:String(i),x:ax+aw-20-i*18});
  pins.forEach(p=>{
    s+=`<circle cx="${p.x}" cy="${ay-4}" r="4" fill="#FFD600" stroke="#0D47A1" stroke-width="1"/>`;
    s+=`<text class="ts" x="${p.x}" y="${ay-12}" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">${p.n}</text>`;
  });
  dpins.forEach(p=>{
    s+=`<circle cx="${p.x}" cy="${ay-4}" r="4" fill="#90CAF9" stroke="#0D47A1" stroke-width="1"/>`;
    s+=`<text class="ts" x="${p.x}" y="${ay-12}" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">${p.n}</text>`;
  });
  return {s, pins, dpins, ax, ay};
}

function getHole(col, row) {
  const bx=120, by=30, startX=bx+12, gapX=14;
  const rowMap = {a:0,b:1,c:2,d:3,e:4,f:5,g:6,h:7,i:8,j:9};
  const x = startX + (col-1)*gapX;
  let y;
  if(rowMap[row]<5) y = by+40+rowMap[row]*18;
  else y = by+148+(rowMap[row]-5)*18;
  return {x,y};
}

function getPin(name, arduinoData) {
  const {pins, dpins, ax, ay} = arduinoData;
  let found = pins.find(p=>p.n===name) || dpins.find(p=>p.n===name);
  if(found) return {x:found.x, y:ay-4};
  return {x:ax+200,y:ay-4};
}

function drawComponents(act, visibleWires) {
  let s = '';
  const hl = (cx,cy,r=5) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFD600" opacity="0.5"><animate attributeName="r" values="${r};${r+3};${r}" dur="1s" repeatCount="indefinite"/></circle>`;

  if(act===0) {
    if(visibleWires.includes('led')){
      const p1=getHole(12,'e'), p2=getHole(13,'e');
      s+=`<line x1="${p1.x}" y1="${p1.y-8}" x2="${p1.x}" y2="${p1.y+2}" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<line x1="${p2.x}" y1="${p2.y-6}" x2="${p2.x}" y2="${p2.y+2}" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>`;
      s+=`<circle cx="${p1.x}" cy="${p1.y-10}" r="5" fill="#FF5252" opacity="0.8"/>`;
      s+=`<text class="ts" x="${p1.x+2}" y="${p1.y-18}" text-anchor="middle" font-size="9" fill="#E53935">LED</text>`;
      s+=hl(p1.x, p1.y); s+=hl(p2.x, p2.y);
    }
    if(visibleWires.includes('resistor')){
      const r1=getHole(12,'d'), r2=getHole(8,'d');
      s+=`<line x1="${r1.x}" y1="${r1.y}" x2="${r2.x}" y2="${r2.y}" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<rect x="${(r1.x+r2.x)/2-12}" y="${r1.y-5}" width="24" height="10" rx="3" fill="#A1887F"/>`;
      s+=`<text class="ts" x="${(r1.x+r2.x)/2}" y="${r1.y+18}" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">220Ω</text>`;
      s+=hl(r1.x,r1.y); s+=hl(r2.x,r2.y);
    }
    if(visibleWires.includes('wire1')){
      const from=getHole(8,'a'), to={x:542-1*18,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+120} L${to.x} ${to.y}" fill="none" stroke="#FF9800" stroke-width="2" stroke-linecap="round"/>`;
      s+=`<text class="ts" x="${to.x}" y="${to.y+22}" text-anchor="middle" font-size="8" fill="#FF9800">pin 13</text>`;
      s+=hl(from.x,from.y); s+=hl(to.x,to.y);
    }
    if(visibleWires.includes('wire2')){
      const from=getHole(13,'a'), to={x:135,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+80} L${to.x} ${to.y}" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>`;
      s+=`<text class="ts" x="${to.x}" y="${to.y+22}" text-anchor="middle" font-size="8" fill="#666">GND</text>`;
      s+=hl(from.x,from.y); s+=hl(to.x,to.y);
    }
  }

  if(act===1) {
    if(visibleWires.includes('buzzer')){
      const p1=getHole(20,'e'), p2=getHole(21,'e');
      s+=`<circle cx="${(p1.x+p2.x)/2}" cy="${p1.y-4}" r="10" fill="#333" stroke="#555" stroke-width="1"/>`;
      s+=`<text class="ts" x="${(p1.x+p2.x)/2}" y="${p1.y-20}" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">蜂鳴器</text>`;
      s+=`<text class="ts" x="${p1.x}" y="${p1.y+12}" text-anchor="middle" font-size="7" fill="#4CAF50">+</text>`;
      s+=`<text class="ts" x="${p2.x}" y="${p2.y+12}" text-anchor="middle" font-size="7" fill="#E53935">−</text>`;
      s+=hl(p1.x,p1.y); s+=hl(p2.x,p2.y);
    }
    if(visibleWires.includes('bwire1')){
      const from=getHole(20,'a'), to={x:542-5*18,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+100} L${to.x} ${to.y}" fill="none" stroke="#FF9800" stroke-width="2" stroke-linecap="round"/>`;
      s+=`<text class="ts" x="${to.x}" y="${to.y+22}" text-anchor="middle" font-size="8" fill="#FF9800">pin 8</text>`;
      s+=hl(from.x,from.y); s+=hl(to.x,to.y);
    }
    if(visibleWires.includes('bwire2')){
      const from=getHole(21,'a'), to={x:135,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+130} L${to.x} ${to.y}" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>`;
      s+=`<text class="ts" x="${to.x}" y="${to.y+22}" text-anchor="middle" font-size="8" fill="#666">GND</text>`;
      s+=hl(from.x,from.y); s+=hl(to.x,to.y);
    }
  }

  if(act===2) {
    if(visibleWires.includes('p-led')){
      const p1=getHole(5,'e'), p2=getHole(6,'e');
      s+=`<line x1="${p1.x}" y1="${p1.y-8}" x2="${p1.x}" y2="${p1.y+2}" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<line x1="${p2.x}" y1="${p2.y-6}" x2="${p2.x}" y2="${p2.y+2}" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>`;
      s+=`<circle cx="${p1.x}" cy="${p1.y-10}" r="5" fill="#FF5252" opacity="0.8"/>`;
      s+=`<text class="ts" x="${p1.x+2}" y="${p1.y-18}" text-anchor="middle" font-size="8" fill="#E53935">LED</text>`;
    }
    if(visibleWires.includes('p-r1')){
      const r1=getHole(5,'d'), r2=getHole(2,'d');
      s+=`<line x1="${r1.x}" y1="${r1.y}" x2="${r2.x}" y2="${r2.y}" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<rect x="${(r1.x+r2.x)/2-10}" y="${r1.y-5}" width="20" height="10" rx="3" fill="#A1887F"/>`;
      s+=`<text class="ts" x="${(r1.x+r2.x)/2}" y="${r1.y+16}" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">220Ω</text>`;
    }
    if(visibleWires.includes('p-w1')){
      const from=getHole(2,'a'), to={x:542-4*18,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+130} L${to.x} ${to.y}" fill="none" stroke="#FF9800" stroke-width="2"/>`;
      s+=`<text class="ts" x="${to.x}" y="${to.y+22}" text-anchor="middle" font-size="7" fill="#FF9800">pin 9</text>`;
    }
    if(visibleWires.includes('p-w2')){
      const from=getHole(6,'a'), to={x:135,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+100} L${to.x} ${to.y}" fill="none" stroke="#333" stroke-width="2"/>`;
      s+=`<text class="ts" x="${to.x+15}" y="${to.y+22}" text-anchor="middle" font-size="7" fill="#666">GND</text>`;
    }
    if(visibleWires.includes('p-ldr')){
      const p1=getHole(15,'e'), p2=getHole(17,'e');
      s+=`<circle cx="${(p1.x+p2.x)/2}" cy="${p1.y-3}" r="7" fill="#CDDC39" stroke="#9E9D24" stroke-width="1"/>`;
      s+=`<text class="ts" x="${(p1.x+p2.x)/2}" y="${p1.y-16}" text-anchor="middle" font-size="8" fill="#9E9D24">光敏電阻</text>`;
    }
    if(visibleWires.includes('p-r2')){
      const r1=getHole(17,'d'), r2=getHole(20,'d');
      s+=`<line x1="${r1.x}" y1="${r1.y}" x2="${r2.x}" y2="${r2.y}" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>`;
      s+=`<rect x="${(r1.x+r2.x)/2-10}" y="${r1.y-5}" width="20" height="10" rx="3" fill="#795548"/>`;
      s+=`<text class="ts" x="${(r1.x+r2.x)/2}" y="${r1.y+16}" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">10KΩ</text>`;
    }
    if(visibleWires.includes('p-w3')){
      const from=getHole(15,'a'), to={x:175,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+110} L${to.x} ${to.y}" fill="none" stroke="#E53935" stroke-width="2"/>`;
      s+=`<text class="ts" x="${to.x}" y="${to.y+22}" text-anchor="middle" font-size="7" fill="#E53935">5V</text>`;
    }
    if(visibleWires.includes('p-w4')){
      const from=getHole(17,'a'), to={x:220,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+140} L${to.x} ${to.y}" fill="none" stroke="#4CAF50" stroke-width="2"/>`;
      s+=`<text class="ts" x="${to.x}" y="${to.y+22}" text-anchor="middle" font-size="7" fill="#4CAF50">A0</text>`;
    }
    if(visibleWires.includes('p-w5')){
      const from=getHole(20,'a'), to={x:155,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+160} L${to.x} ${to.y}" fill="none" stroke="#333" stroke-width="2"/>`;
      s+=`<text class="ts" x="${to.x}" y="${to.y+22}" text-anchor="middle" font-size="7" fill="#666">GND</text>`;
    }
    if(visibleWires.includes('p-buz')){
      const p1=getHole(25,'e'), p2=getHole(26,'e');
      s+=`<circle cx="${(p1.x+p2.x)/2}" cy="${p1.y-3}" r="9" fill="#333" stroke="#555" stroke-width="1"/>`;
      s+=`<text class="ts" x="${(p1.x+p2.x)/2}" y="${p1.y-18}" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">蜂鳴器</text>`;
    }
    if(visibleWires.includes('p-w6')){
      const from=getHole(25,'a'), to={x:542-5*18,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+100} L${to.x} ${to.y}" fill="none" stroke="#2196F3" stroke-width="2"/>`;
      s+=`<text class="ts" x="${to.x}" y="${to.y+22}" text-anchor="middle" font-size="7" fill="#2196F3">pin 8</text>`;
    }
    if(visibleWires.includes('p-w7')){
      const from=getHole(26,'a'), to={x:145,y:385-4};
      s+=`<path d="M${from.x} ${from.y} L${from.x} ${from.y+120} L${to.x+10} ${to.y}" fill="none" stroke="#555" stroke-width="2"/>`;
      s+=`<text class="ts" x="${to.x+10}" y="${to.y+22}" text-anchor="middle" font-size="7" fill="#666">GND</text>`;
    }
  }
  return s;
}

function render() {
  const act = activities[currentAct];
  const step = act.steps[currentStep];
  const svg = document.getElementById('diagram');
  let content = '';
  content += drawBreadboard();
  const ard = drawArduino();
  content += ard.s;
  content += drawComponents(currentAct, step.wires);
  svg.innerHTML = content;

  document.getElementById('wire-desc').innerHTML = step.desc;
  document.getElementById('tip-area').textContent = step.tip || '';
  document.getElementById('tip-area').style.display = step.tip ? 'block' : 'none';
  document.getElementById('step-info').textContent = `步驟 ${currentStep+1} / ${act.steps.length}`;
  document.getElementById('prev-btn').disabled = currentStep === 0;
  document.getElementById('next-btn').disabled = currentStep === act.steps.length - 1;

  let partsHtml = '<div class="parts">';
  act.parts.forEach(p => partsHtml += `<span class="part">${p}</span>`);
  partsHtml += '</div>';
  document.getElementById('parts-area').innerHTML = partsHtml;
}

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  activities.forEach((a, i) => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (i === currentAct ? ' active' : '');
    btn.textContent = a.name;
    btn.onclick = () => { currentAct = i; currentStep = 0; renderTabs(); render(); };
    el.appendChild(btn);
  });
}

function nextStep() { if(currentStep < activities[currentAct].steps.length-1){ currentStep++; render(); } }
function prevStep() { if(currentStep > 0){ currentStep--; render(); } }

renderTabs();
render();
</script>
